<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1440" viewBox="0 0 720 1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b141b"/>
      <stop offset="100%" stop-color="#070c10"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Wallpaper -->
  <rect width="720" height="1440" fill="url(#bg)"/>
  
  <!-- Subtle doodle watermark patterns -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="2" fill="none">
    <circle cx="120" cy="300" r="40"/>
    <path d="M500 500 Q550 450 600 500 T700 500"/>
    <rect x="80" y="800" width="60" height="60" rx="10"/>
    <circle cx="580" cy="1100" r="50"/>
  </g>

  <!-- Top App Bar -->
  <rect width="720" height="110" fill="#121b22"/>
  <path d="M48 55 L28 55 M38 45 L28 55 L38 65" stroke="#e9edef" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Profile Avatar -->
  <circle cx="95" cy="55" r="26" fill="#202c33"/>
  <circle cx="95" cy="48" r="10" fill="#8696a0"/>
  <path d="M78 68 C80 60 110 60 112 68" fill="#8696a0"/>
  
  <!-- Contact Name & Privacy-Protected Number Badge -->
  <text x="135" y="50" fill="#e9edef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="21">Verified Customer</text>
  <rect x="135" y="62" width="180" height="20" rx="5" fill="#1f2c34" stroke="#2a3942" stroke-width="1"/>
  <text x="145" y="76" fill="#4ade80" font-family="sans-serif" font-weight="bold" font-size="11">🔒 NUMBER PROTECTED</text>
  
  <!-- 23h Badge & Menu Icons -->
  <rect x="525" y="38" width="85" height="34" rx="17" fill="#202c33"/>
  <text x="560" y="61" fill="#8696a0" font-family="sans-serif" font-size="16">⏳ 23h</text>
  
  <circle cx="670" cy="45" r="3.5" fill="#8696a0"/>
  <circle cx="670" cy="55" r="3.5" fill="#8696a0"/>
  <circle cx="670" cy="65" r="3.5" fill="#8696a0"/>

  <!-- Warning Banner -->
  <g filter="url(#shadow)">
    <rect x="160" y="140" width="510" height="75" rx="12" fill="#182229"/>
    <text x="180" y="172" fill="#ffd279" font-family="sans-serif" font-weight="bold" font-size="16">⚠️ Please Send Payment Screenshot of Full Details</text>
    <text x="180" y="196" fill="#ffd279" font-family="sans-serif" font-weight="bold" font-size="16">For Confirmation⚠️</text>
    <text x="615" y="202" fill="#8696a0" font-family="sans-serif" font-size="12">2:36 PM ✓</text>
  </g>

  <!-- Incoming Msg: Payment send -->
  <path d="M40 245 L50 255 L50 305 L210 305 L210 245 Z" fill="#9de622"/>
  <rect x="40" y="245" width="170" height="65" rx="12" fill="#9de622"/>
  <text x="60" y="278" fill="#111b21" font-family="sans-serif" font-weight="bold" font-size="17">Payment send</text>
  <text x="145" y="300" fill="#3b5212" font-family="sans-serif" font-size="12">8:22 PM</text>

  <!-- Payment Receipt Card (Easypaisa / Interbank) with Customer Number and Private Data Strictly Hidden -->
  <g filter="url(#shadow)">
    <!-- White Card Base -->
    <rect x="40" y="330" width="450" height="490" rx="28" fill="#ffffff"/>
    
    <!-- Top Green Circle Success Icon -->
    <circle cx="265" cy="400" r="42" fill="#22c55e"/>
    <path d="M248 400 L260 412 L284 386" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Heading -->
    <text x="265" y="475" fill="#0f172a" font-family="sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="0.5">FUNDS TRANSFERRED</text>
    <text x="265" y="505" fill="#64748b" font-family="sans-serif" font-size="14" text-anchor="middle">Transaction reference ID # 2676••••••••</text>
    <text x="265" y="528" fill="#0f172a" font-family="sans-serif" font-weight="700" font-size="15" text-anchor="middle">24-Sep-2026 08:18:10 PM</text>

    <!-- Paid From Box: Customer Name shown, Customer Number completely HIDDEN -->
    <rect x="58" y="550" width="414" height="65" rx="10" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="576" fill="#475569" font-family="sans-serif" font-weight="800" font-size="13">PAID FROM</text>
    <text x="450" y="576" fill="#0f172a" font-family="sans-serif" font-weight="800" font-size="14" text-anchor="end">SHAHBAZ (Verified)</text>
    <!-- Customer Number Row Strictly Censored / Hidden -->
    <rect x="290" y="586" width="165" height="20" rx="5" fill="#0284c7"/>
    <text x="372" y="600" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">🔒 NUMBER HIDDEN</text>

    <!-- Transfer Type Box -->
    <rect x="58" y="625" width="414" height="48" rx="10" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="655" fill="#475569" font-family="sans-serif" font-weight="800" font-size="13">TRANSFER TYPE</text>
    <text x="450" y="655" fill="#0f172a" font-family="sans-serif" font-weight="700" font-size="14" text-anchor="end">Interbank</text>

    <!-- Beneficiary Box -->
    <rect x="58" y="683" width="414" height="85" rx="10" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="718" fill="#475569" font-family="sans-serif" font-weight="800" font-size="13">BENEFICIARY</text>
    <text x="450" y="712" fill="#0f172a" font-family="sans-serif" font-weight="800" font-size="14" text-anchor="end">SAIMA SIDDIQUE</text>
    <!-- Beneficiary Account Number Protected -->
    <rect x="280" y="722" width="175" height="18" rx="4" fill="#64748b"/>
    <text x="367" y="735" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">🔒 ACCOUNT PROTECTED</text>
    <text x="450" y="756" fill="#059669" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="end">Easypaisa Bank Limited</text>

    <!-- Green tail tab -->
    <rect x="40" y="780" width="450" height="40" rx="10" fill="#9de622"/>
    <text x="430" y="805" fill="#2d420c" font-family="sans-serif" font-size="13" text-anchor="end">8:22 PM</text>
  </g>

  <!-- Incoming Msg: For nord vpn -->
  <rect x="40" y="845" width="160" height="60" rx="12" fill="#9de622" filter="url(#shadow)"/>
  <text x="60" y="878" fill="#111b21" font-family="sans-serif" font-weight="bold" font-size="17">For nord vpn</text>
  <text x="150" y="897" fill="#3b5212" font-family="sans-serif" font-size="11">8:23 PM</text>

  <!-- Service Rate Card: Interactive / Premium VPN Services -->
  <g filter="url(#shadow)">
    <rect x="330" y="930" width="350" height="340" rx="16" fill="#182229" stroke="#2a3942" stroke-width="1.5"/>
    
    <text x="355" y="965" fill="#86efac" font-family="sans-serif" font-size="14">✨ INTERACTIVE</text>
    <text x="355" y="1000" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="18">🔒 *PREMIUM VPN SERVICES*</text>
    
    <line x1="355" y1="1020" x2="655" y2="1020" stroke="#2a3942" stroke-width="1"/>
    
    <!-- NordVPN section -->
    <text x="355" y="1055" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="17">*NORDVPN*</text>
    <text x="365" y="1085" fill="#cbd5e1" font-family="sans-serif" font-size="15">▫ 3 Months — <tspan fill="#4ade80" font-weight="bold">*Rs. 800*</tspan></text>
    <text x="365" y="1115" fill="#cbd5e1" font-family="sans-serif" font-size="15">▫ 12 Months — <tspan fill="#4ade80" font-weight="bold">*Rs. 2,800*</tspan></text>

    <!-- Surfshark section -->
    <text x="355" y="1160" fill="#2dd4bf" font-family="sans-serif" font-weight="bold" font-size="17">*SURFSHARK VPN*</text>
    <text x="365" y="1190" fill="#cbd5e1" font-family="sans-serif" font-size="15">▫ 2 Months — <tspan fill="#4ade80" font-weight="bold">*Rs. 600*</tspan></text>
    <text x="365" y="1220" fill="#cbd5e1" font-family="sans-serif" font-size="15">▫ 12 Months — <tspan fill="#4ade80" font-weight="bold">*Rs. 3,000*</tspan></text>
  </g>

  <!-- Bottom Chat Input Bar -->
  <rect y="1340" width="720" height="100" fill="#0b141b"/>
  <rect x="25" y="1355" width="580" height="60" rx="30" fill="#202c33"/>
  <circle cx="55" cy="1385" r="14" fill="none" stroke="#8696a0" stroke-width="2.5"/>
  <text x="90" y="1392" fill="#8696a0" font-family="sans-serif" font-size="17">Type a message or /</text>
  <circle cx="655" cy="1385" r="28" fill="#00a884"/>
  <path d="M650 1375 L660 1385 L650 1395" fill="none" stroke="#111b21" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
